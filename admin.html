<!DOCTYPE html>
<html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - AS. Shop BD</title>
<style>body{font-family:sans-serif;background:#f1f5f9;margin:0;padding:16px}.box{background:#fff;padding:16px;border-radius:14px;border:1px solid #e2e8f0;margin-bottom:16px}input,select,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;margin:6px 0}button{padding:11px 16px;border:none;border-radius:8px;font-weight:700;cursor:pointer}.b1{background:#0ea5e9;color:#fff}.b2{background:#0f172a;color:#fff}.b3{background:#ef4444;color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:800px){.grid{grid-template-columns:1fr}}.prod{display:flex;gap:10px;align-items:center;border-bottom:1px solid #eee;padding:10px 0}.prod img{width:60px;height:60px;object-fit:cover;border-radius:8px}</style>
</head><body>
<h2>AS. Shop BD - Full Control Admin</h2>
<div class="grid">
<div>
<div class="box"><h3>🛍️ দোকানের সেটিংস</h3>
<label>শপের নাম</label><input id="shop">
<label>লোগো আপলোড</label><input id="logoF" type="file" accept="image/*">
<label>WhatsApp নাম্বার (880 দিয়ে)</label><input id="wa" value="8801407364479">
<label>হিরো টাইটেল</label><textarea id="hTitle">Premium Headphones & Phone Back Covers</textarea>
<label>হিরো সাব-টাইটেল</label><input id="hSub" value="অরিজিনাল গ্যাজেট সবচেয়ে কম দামে">
<label>হিরো ব্যানার ছবি আপলোড</label><input id="hImgF" type="file" accept="image/*">
<label>ফুটার লেখা</label><input id="footer">
<button class="b1" onclick="saveAll()">💾 সব Save করুন</button>
</div>
<div class="box"><h3>➕ নতুন প্রোডাক্ট</h3>
<input id="pName" placeholder="নাম"><input id="pPrice" type="number" placeholder="দাম"><input id="pOld" type="number" placeholder="আগের দাম"><select id="pCat"><option>Headphone</option><option>Earbuds</option><option>Back Cover</option><option>Charger</option><option>Others</option></select><input id="pDesc" placeholder="বিবরণ"><label>প্রোডাক্ট ছবি</label><input id="pImgF" type="file" accept="image/*"><button class="b1" onclick="addP()">Add Product</button></div>
</div>
<div><div class="box"><h3>📦 প্রোডাক্ট লিস্ট (Edit/Delete)</h3><div id="list"></div><br><a href="index.html" target="_blank"><button class="b2">🌐 ওয়েবসাইট দেখুন</button></a><button class="b3" onclick="if(confirm('সব ডিলিট হবে!')){localStorage.clear();location.reload();}" style="margin-left:8px">Reset All</button></div></div>
</div>
<script>
let products=JSON.parse(localStorage.getItem('as_products')||'null')||[{id:1,name:'P9 Bluetooth Headphone',price:1250,oldPrice:1850,cat:'Headphone',desc:'Super Bass',img:'https://images.unsplash.com/photo-1546435770-a3e426bf472b'},{id:2,name:'TWS M10 Earbuds',price:850,oldPrice:1200,cat:'Earbuds',desc:'LED Display',img:'https://images.unsplash.com/photo-1590658268037-6bf12165a8df'}];
let tempLogo=localStorage.getItem('as_logo')||'';let tempHero=localStorage.getItem('as_hImg')||'';
document.getElementById('shop').value=localStorage.getItem('as_shop')||'AS. Shop BD';document.getElementById('wa').value=localStorage.getItem('as_wa')||'8801407364479';document.getElementById('hTitle').value=localStorage.getItem('as_hTitle')||'Premium Headphones & Phone Back Covers';document.getElementById('hSub').value=localStorage.getItem('as_hSub')||'অরিজিনাল গ্যাজেট সবচেয়ে কম দামে';document.getElementById('footer').value=localStorage.getItem('as_footer')||'© 2026 AS. Shop BD | WhatsApp: +8801407364479';
document.getElementById('logoF').addEventListener('change',e=>{const r=new FileReader();r.onload=ev=>tempLogo=ev.target.result;r.readAsDataURL(e.target.files[0]);});
document.getElementById('hImgF').addEventListener('change',e=>{const r=new FileReader();r.onload=ev=>tempHero=ev.target.result;r.readAsDataURL(e.target.files[0]);});
function saveAll(){localStorage.setItem('as_shop',document.getElementById('shop').value);localStorage.setItem('as_wa',document.getElementById('wa').value);localStorage.setItem('as_hTitle',document.getElementById('hTitle').value);localStorage.setItem('as_hSub',document.getElementById('hSub').value);localStorage.setItem('as_footer',document.getElementById('footer').value);if(tempLogo)localStorage.setItem('as_logo',tempLogo);if(tempHero)localStorage.setItem('as_hImg',tempHero);alert('✅ সব Save হয়েছে! এখন index.html ওপেন করুন');}
function render(){const l=document.getElementById('list');l.innerHTML='';products.forEach((p,i)=>{l.innerHTML+=`<div class="prod"><img src="${p.img}"><div style="flex:1"><b>${p.name}</b><br><small>৳${p.price} | ${p.cat}</small></div><button class="b3" onclick="del(${i})">Del</button></div>`});}
function addP(){const f=document.getElementById('pImgF').files[0];const save=img=>{products.push({id:Date.now(),name:pName.value,price:pPrice.value,oldPrice:pOld.value,cat:pCat.value,desc:pDesc.value,img:img});localStorage.setItem('as_products',JSON.stringify(products));render();alert('Added');};if(f){const r=new FileReader();r.onload=e=>save(e.target.result);r.readAsDataURL(f);}else save('https://images.unsplash.com/photo-1546435770-a3e426bf472b');}
function del(i){if(confirm('Delete?')){products.splice(i,1);localStorage.setItem('as_products',JSON.stringify(products));render();}}render();
</script>
</body></html>
