<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AS. Shop BD</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--p:#0ea5e9;--d:#0f172a;--w:#25D366}
*{box-sizing:border-box}body{margin:0;font-family:'Hind Siliguri',sans-serif;background:#f8fafc;color:#0f172a}
.header{position:sticky;top:0;z-index:99;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid #e2e8f0;padding:10px 5%;display:flex;justify-content:space-between;align-items:center}
.logo{font-family:'Outfit';font-weight:800;font-size:22px;display:flex;align-items:center;gap:10px}.logo img{height:42px;border-radius:10px;object-fit:contain;background:#fff}
.hero{background:linear-gradient(100deg,#020617,#1e293b);color:#fff;padding:45px 5%;display:grid;grid-template-columns:1.2fr.8fr;gap:20px;align-items:center;border-radius:0 0 28px 28px}
.hero h1{font-family:'Outfit';font-size:40px;line-height:1.1;margin:0}
.products{padding:30px 5%;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.card{background:#fff;border-radius:18px;overflow:hidden;border:1px solid #e2e8f0;box-shadow:0 10px 25px rgba(0,0,0,.05);transition:.2s}
.card:hover{transform:translateY(-4px)}.card img{width:100%;height:240px;object-fit:cover;background:#f1f5f9}
.badge{background:#e0f2fe;color:#0284c7;padding:3px 9px;border-radius:99px;font-size:12px}
.price{font-weight:800;font-size:19px}.old{color:#94a3b8;text-decoration:line-through;margin-left:6px;font-size:14px}
.btn-wa{width:100%;margin-top:10px;background:var(--w);color:#fff;border:none;padding:12px;border-radius:10px;font-weight:700;cursor:pointer}
.footer{background:#0f172a;color:#94a3b8;text-align:center;padding:22px 5%;margin-top:30px;font-size:14px}
@media(max-width:768px){.hero{grid-template-columns:1fr}.hero h1{font-size:30px}}
</style>
</head>
<body>
<div class="header">
<div class="logo"><img id="siteLogo" style="display:none"><span id="siteName">AS. Shop BD</span></div>
<div id="topWa" style="font-size:12px;color:#64748b">WhatsApp: 01407364479</div>
</div>

<div class="hero">
<div>
<h1 id="heroTitle">Premium Headphones & Phone Back Covers</h1>
<p id="heroSub" style="color:#cbd5e1;margin:14px 0">অরিজিনাল গ্যাজেট সবচেয়ে কম দামে - সারা বাংলাদেশে ক্যাশ অন ডেলিভারি</p>
<a href="#products" style="background:#0ea5e9;color:#fff;padding:12px 22px;border-radius:999px;text-decoration:none;font-weight:700;display:inline-block">প্রোডাক্ট দেখুন</a>
</div>
<img id="heroImg" src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e" style="width:100%;height:300px;object-fit:cover;border-radius:20px">
</div>

<div id="products" class="products"></div>
<div class="footer" id="footerTxt">© 2026 AS. Shop BD - All Rights Reserved | WhatsApp: +8801407364479</div>

<script>
function loadSite(){
 const d={
  shop:localStorage.getItem('as_shop')||'AS. Shop BD',
  logo:localStorage.getItem('as_logo')||'',
  wa:localStorage.getItem('as_wa')||'8801407364479',
  hTitle:localStorage.getItem('as_hTitle')||'Premium Headphones &<br>Phone Back Covers',
  hSub:localStorage.getItem('as_hSub')||'অরিজিনাল গ্যাজেট সবচেয়ে কম দামে - সারা বাংলাদেশে ক্যাশ অন ডেলিভারি',
  hImg:localStorage.getItem('as_hImg')||'https://images.unsplash.com/photo-1505740420928-5e560c06d30e',
  footer:localStorage.getItem('as_footer')||'© 2026 AS. Shop BD - All Rights Reserved | WhatsApp: +8801407364479',
  products:JSON.parse(localStorage.getItem('as_products')||'null')||[
   {id:1,name:'P9 Bluetooth Headphone',price:1250,oldPrice:1850,cat:'Headphone',desc:'Super Bass, 20H Battery',img:'https://images.unsplash.com/photo-1546435770-a3e426bf472b'},
   {id:2,name:'TWS M10 Earbuds',price:850,oldPrice:1200,cat:'Earbuds',desc:'LED Display + Power Bank Case',img:'https://images.unsplash.com/photo-1590658268037-6bf12165a8df'},
   {id:3,name:'Transparent Back Cover',price:350,oldPrice:550,cat:'Back Cover',desc:'Shockproof Clear Case',img:'https://images.unsplash.com/photo-1605236453806-6ff36851218e'}
  ]
 };
 document.getElementById('siteName').innerHTML=d.shop;
 document.getElementById('topWa').innerText='WhatsApp: '+d.wa.replace('880','0');
 document.getElementById('heroTitle').innerHTML=d.hTitle;
 document.getElementById('heroSub').innerText=d.hSub;
 document.getElementById('footerTxt').innerText=d.footer;
 if(d.logo){document.getElementById('siteLogo').src=d.logo;document.getElementById('siteLogo').style.display='block';}
 if(d.hImg){document.getElementById('heroImg').src=d.hImg;}
 const box=document.getElementById('products');box.innerHTML='';
 d.products.forEach(p=>{
  const msg=`Assalamu Alaikum!%0AAmi order korte chai:%0A%0A*Product:* ${p.name}%0A*Price:* ${p.price} TK%0A*ID:* ${p.id}%0A%0ADelivery address?`;
  const waLink=`https://wa.me/${d.wa}?text=${msg}`;
  box.innerHTML+=`<div class="card"><img src="${p.img}"><div style="padding:14px"><span class="badge">${p.cat}</span><h3 style="margin:8px 0 4px">${p.name}</h3><p style="margin:0;color:#64748b;font-size:13px">${p.desc}</p><div style="margin-top:8px"><span class="price">৳${p.price}</span><span class="old">৳${p.oldPrice}</span></div><button class="btn-wa" onclick="window.open('${waLink}','_blank')">📲 WhatsApp এ অর্ডার করুন</button></div></div>`;
 });
}
loadSite();
</script>
</body>
</html>
